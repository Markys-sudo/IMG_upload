version: "3.9"

services:
  app:
    build: .
    container_name: image_app
    volumes:
      - images:/images
      - logs:/logs
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: image_nginx
    ports:
      - "8080:80"
    volumes:
      - images:/images
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

volumes:
  images:
  logs:

networks:
  app-network:
    driver: bridge
