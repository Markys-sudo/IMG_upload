version: "3.9"

services:
  app:
    build: .
    container_name: image_app
    image: python:3.12-slim
    ports:
      - "8000:8000"
    volumes:
      - ./images:/images
      - ./logs:/logs
    restart: always

  nginx:
    image: nginx:latest
    container_name: image_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./images:/images
    depends_on:
      - app
    restart: always
