services:
  app:
    build: .
    container_name: image_app
    volumes:
      - ./images:/app/images
      - ./static:/app/static
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: image_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/app/images
      - ./static:/app/static
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
